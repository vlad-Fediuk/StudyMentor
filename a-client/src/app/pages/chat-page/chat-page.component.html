<main class="chat-page">
  <section class="messages" aria-live="polite">
    @for (message of messages; track $index) {
      <article class="message" [class.message-user]="message.role === 'user'">
        {{ message.content }}
      </article>
    }

    @if (isSending) {
      <article class="message message-assistant">AI думає...</article>
    }

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }
  </section>

  <form
    class="prompt-bar"
    aria-label="Ask anything"
    autocomplete="off"
    (submit)="sendMessage(messageInput, $event)"
  >
    <input
      #messageInput
      class="prompt-input"
      type="text"
      name="study-mentor-chat-message"
      placeholder="Напиши повідомлення..."
      aria-label="Повідомлення"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
      [disabled]="isSending"
    />

    <button
      class="send-button"
      type="submit"
      aria-label="Надіслати"
      [disabled]="isSending"
    >
      <svg
        aria-hidden="true"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M5 12L3 4L21 12L3 20L5 12ZM5 12H13"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </form>
</main>
