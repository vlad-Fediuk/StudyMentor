<main class="chat-page">
  <section class="messages" aria-live="polite">
    @for (message of messages; track $index) {
      <article
        class="message"
        [class.message-assistant]="message.role === 'assistant'"
        [class.message-user]="message.role === 'user'"
        [innerHTML]="renderMessageContent(message)"
      ></article>
    }

    @if (isSending) {
      <article class="message message-assistant">AI думає...</article>
    }

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <div #messagesEnd aria-hidden="true"></div>
  </section>

  <button
    class="scroll-button"
    [class.scroll-button-visible]="showScrollButton"
    type="button"
    (click)="goToLatestMessage()"
  ></button>

  <div class="prompt-backdrop" aria-hidden="true"></div>

  <form
    class="prompt-bar"
    aria-label="Ask anything"
    autocomplete="off"
    (submit)="sendMessage(messageInput, $event)"
  >
    <input
      #messageInput
      class="prompt-input"
      type="text"
      name="study-mentor-chat-message"
      placeholder="Напиши повідомлення..."
      aria-label="Повідомлення"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
    />

    <button
      class="send-button"
      type="submit"
      aria-label="Надіслати"
      [disabled]="isSending"
    >
      <svg
        aria-hidden="true"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M5 12L3 4L21 12L3 20L5 12ZM5 12H13"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </form>
</main>
