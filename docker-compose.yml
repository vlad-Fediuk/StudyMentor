services:
  api:
    build:
      context: .
      dockerfile: study-mentor-api/Dockerfile
    container_name: study-mentor-api
    restart: unless-stopped
    ports:
      - "5132:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-study_mentor};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};"
      Jwt__Campus__Key: "${Jwt__Campus__Key:-change_me_super_secret_jwt_key_at_least_32_chars_long}"
      Jwt__Campus__Issuer: "${Jwt__Campus__Issuer:-StudyMentorApi}"
      Jwt__Campus__Audience: "${Jwt__Campus__Audience:-StudyMentorClient}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      RateLimiting__Enabled: "${RateLimiting__Enabled:-true}"
      Caching__Enabled: "${Caching__Enabled:-true}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: study-mentor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: ${POSTGRES_DB:-study_mentor}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-study_mentor}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
